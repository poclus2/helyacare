# Railway configuration for Medusa Backend
# Railpack : NODE_ENV=production
# --no-admin supprimé dans Medusa v2.13.6 → désactiver via MEDUSA_ADMIN_DISABLE=true (env Railway)
# ignore-scripts=true dans .npmrc → skip compilation native @swc/core

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npx medusa db:migrate && (npx medusa user -e admin@helyacare.com -p 'HelyaCare2026!' || true) && npm run start"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
