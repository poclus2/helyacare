# Railway configuration for Medusa Backend
# Nixpacks : cache npm natif Railway = pas de timeout
# --no-admin : évite la compilation Vite/React du dashboard (trop lente)
# --ignore-scripts : évite les postinstall natifs lents (@swc/core, bcrypt)

[build]
builder = "NIXPACKS"
buildCommand = "npm install --ignore-scripts && npx medusa build --no-admin"

[deploy]
startCommand = "npx medusa db:migrate && (npx medusa user -e admin@helyacare.com -p 'HelyaCare2026!' || true) && npm run start"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
