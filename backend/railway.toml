# Railway configuration for Medusa Backend
# Railpack : NODE_ENV=production, override install via railpack.json
# railpack.json : npm install --ignore-scripts --prefer-offline
# --no-admin : évite la compilation Vite/React du dashboard (trop lente)

[build]
builder = "RAILPACK"
buildCommand = "npx medusa build --no-admin"

[deploy]
startCommand = "npx medusa db:migrate && (npx medusa user -e admin@helyacare.com -p 'HelyaCare2026!' || true) && npm run start"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
